<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaelen's Realm | The Arcane Heart</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Georgia, serif;
    background: #101b17;
    color: #eee8d5;
    line-height: 1.7;
}

header {
    text-align: center;
    padding: 65px 20px;
    background: linear-gradient(135deg, #1e382c, #101b17);
    border-bottom: 2px solid #b99a55;
}

header h1 {
    color: #e2c47c;
    font-size: 42px;
    margin: 0;
}

header p {
    color: #c9c0a8;
    font-style: italic;
}

nav {
    background: #19271f;
    text-align: center;
    padding: 15px;
    border-bottom: 1px solid #75613b;
}

nav a {
    color: #e2c47c;
    text-decoration: none;
    margin: 10px;
    display: inline-block;
}

nav a:hover {
    color: white;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 30px 20px;
}

.panel {
    background: #1b2a22;
    border: 1px solid #75613b;
    border-radius: 12px;
    padding: 25px;
    margin: 25px 0;
}

h2 {
    color: #e2c47c;
}

.button {
    display: inline-block;
    background: #b99a55;
    color: #172018;
    padding: 12px 24px;
    border-radius: 7px;
    text-decoration: none;
    font-weight: bold;
    margin-top: 10px;
}

.button:hover {
    background: #e2c47c;
}

footer {
    text-align: center;
    padding: 30px;
    color: #a99f89;
    border-top: 1px solid #75613b;
}
</style>
</head>

<body>

<header>
    <h1>Vaelen's Realm</h1>
    <p>A world waiting beyond the ordinary.</p>
    <p>Created by THE ARCANE HEART</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="character.html">Character Creation</a>
    <a href="#world">The World</a>
    <a href="#adventure">Adventure</a>
    <a href="#about">About</a>
</nav>

<main>

<section class="panel">
    <h2>Welcome, Traveler.</h2>
    <p>
        You have arrived in a world unlike your own.
        Beyond the forests and rolling farmland lies a
        Renaissance civilization inhabited by furry folk,
        ancient traditions, bustling villages, and mysteries
        waiting to be uncovered.
    </p>

    <p>
        You are something new to this world. Your arrival
        may change more than you realize.
    </p>

    <a class="button" href="character.html">
        Create Your Character
    </a>
</section>

<section class="panel" id="world">
    <h2>A Living World</h2>
    <p>
        Explore a society of towns, farms, guilds, markets,
        woodland settlements, and ancient secrets.
        Every place has its own people, customs, and stories.
    </p>
</section>

<section class="panel" id="adventure">
    <h2>Your Story, Your Choice</h2>
    <p>
        Become an adventurer, find a home, make friends,
        learn the local language, join a guild, or build
        an entirely new life.
    </p>
    <p>
        There is no single path. Your decisions shape
        your experience.
    </p>
</section>

<section class="panel" id="about">
    <h2>About the Realm</h2>
    <p>
        Vaelen's Realm is a fantasy text-adventure project
        created by THE ARCANE HEART.
    </p>
    <p>
        This is an evolving world. New places, characters,
        and adventures will be added as the realm grows.
    </p>
</section>

</main>

<footer>
    <p>Vaelen's Realm</p>
    <p>Created by THE ARCANE HEART</p>
</footer>

</body>
</html>
